<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/styles/global.css" />
    <link rel="stylesheet" href="src/styles/style.css" />
    <title>TechFood - Cadastrar Prato</title>
  </head>
  <body>
    <header id="topo-loja">
      <h1 id="titulo-site">TechFood - Sabor & Saber</h1>
      <p id="boas-vindas">Carregando...</p>

      <input type="checkbox" id="bt_menu" />
      <label for="bt_menu" id="label-menu" aria-label="Abrir menu de navegação">
        &#9776;
      </label>

      <nav id="menu" role="navigation" aria-label="Menu principal">
        <ul>
          <li><a href="index.html">Cardápio</a></li>
          <li><a href="cadastro.html" class="ativo">Cadastrar Prato</a></li>
          <li><a href="pedidos.html">Meus Pedidos</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="secao-cadastro">
        <h2 class="titulo-secao">&#127859; Cadastrar Prato</h2>
        <p>
          Complete os dados do prato abaixo. Esta página está pronta para a
          próxima etapa de implementação do cadastro.
        </p>

        <form id="form-cadastro">
          <label for="nome-prato">Nome do prato</label>
          <input type="text" id="nome-prato" name="nome-prato" placeholder="Ex: Lasanha Bolonhesa" />

          <label for="preco-prato">Preço</label>
          <input type="text" id="preco-prato" name="preco-prato" placeholder="R$ 45,00" />

          <label for="descricao-prato">Descrição</label>
          <textarea id="descricao-prato" name="descricao-prato" rows="4" placeholder="Massa artesanal com molho especial..."></textarea>

          <button type="submit" class="btn-pedido">Cadastrar</button>
        </form>
      </section>
    </main>

    <footer id="rodape">
      <div class="info-footer">
        <p><strong>TechFood 2026</strong></p>
        <p>Escola SENAI Ítalo Bologna - Itu/SP</p>
        <p>Av. das Nações, 1500</p>
      </div>
      <p id="data-hora-footer"></p>
    </footer>

    <script src="src/scripts/global.js"></script>
  </body>
</html>
