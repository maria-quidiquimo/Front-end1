<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>TechFood - Cardápio Digital</title>
    <link rel="stylesheet" href="src/style/style.css">
</head>
<body>
    <header class="header">
        <h3 class="logo">TechFood</h3>
        <nav>
            <li class="search-icon" aria-label="pesquise um produto">🔍</li> 
            <li class="cart-icon" aria-label="Seu carrinho">🛒</li>
        </nav>
    </header>

    <h1 class="banner-hero">
        <h1>Sabor & Saber</h1>
        <p>A melhor gastronomia tecnológica da região.</p>
    </h1>

    <nav class="menu-container">
        <li class="abas-lista">
            <input type="radio" name="categoria" id="massa" checked>
            <label for="massa">Massas</label>

            <input type="radio" name="categoria" id="bebida">
            <label for="bebida">Bebidas</label>

            <input type="radio" name="categoria" id="doce">
            <label for="doce">Doces</label>
        </nav>

    <main>
        <nav class="aba-tela" id="tela-massas">
            <section class="grid-produtos">
                <article class="card">
                    <img src="src/imagens/lasanha.jpg" alt="imagem de um pedaço de lasanha">
                    <h3>Lasanha Tradicional</h3>
                    <p>Massa artesanal ao molho bolonhesa com 4 queijos.</p>
                    <p class="preco">R$ 45,90</p>
                    <button class="btn-pedir" onclick="alert('Adicionado')">Pedir</button>
                </article>

                <article class="card">
                    <img src="src/imagens/ravioli.jpg">
                    <h3>Ravioli de Espinafre</h3>
                    <p>Recheado com ricota fresca e nozes picadas.</p>
                    <p class="preco">R$ 39,00</p>
                    <button class="btn-pedir">Pedir</button>
                </article>
            </section>
        </nav>
    </main>

    <footer class="rodape">
        <p aria-label="redes sociais">Siga-nos: 
            <a href="#">FB</a> 
            <a href="#">IG</a>
        </p>
    </footer>
</body>
</html>
